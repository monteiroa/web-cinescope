<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineScope</title>  
    
    <link rel="stylesheet" href="../css/catalogo.css">
</head>

<body>

    <!-- Fundo da página -->
    <div class="fundo"></div>


    <!-- Conteúdo principal -->
    <main class="container">

        <!-- Cabeçalho -->
        <header>

            <!-- Logo -->
            <div class="logo">
                Cine<span>Scope</span>
            </div>


            <!-- Menu -->
            <nav>
                <a href="../index.html">Início</a>
                <a href="catalogo.html" >Catálogo</a>
                <!-- <a href="#">Favoritos</a> -->
                <a href="filtro.html">Filtros</a>
            </nav>

        </header>


        <!-- Barra de pesquisa -->
        <div class="pesquisa">

            <span class="icone">⌕</span>

            <input
                type="text"
                placeholder="Buscar filmes..."
            >

        </div>


        <!-- Título do catálogo -->
        <section class="titulo-catalogo">

            <div>
                <h1>Catálogo</h1>

                <span>6 filmes</span>
            </div>


            <!-- Filtros -->
            <div class="filtros">

                <button>
                    Gênero
                    <span>⌄</span>
                </button>

                <button>
                    Ano
                    <span>⌄</span>
                </button>

                <button>
                    Avaliação
                    <span>⌄</span>
                </button>

            </div>

        </section>


        <!-- Catálogo de filmes -->
        <section class="catalogo">


            <!-- FILME 1 -->
            <article class="filme">

                <div class="poster poster1">

                    <!-- <span class="favorito">♡</span> -->

                    <div class="lua"></div>

                    <div class="montanha"></div>

                    <div class="personagem"></div>

                </div>


                <h2>Horizontes</h2>

                <p class="informacoes">
                    2023 | Ficção Científica
                </p>

                <p class="avaliacao">
                    <span>★</span> 8.4
                </p>

            </article>


            <!-- FILME 2 -->
            <article class="filme">

                <div class="poster poster2">

                    <!-- <span class="favorito">♡</span> -->

                    <div class="porta"></div>

                    <div class="luz"></div>

                </div>


                <h2>A Última Porta</h2>

                <p class="informacoes">
                    2022 | Suspense
                </p>

                <p class="avaliacao">
                    <span>★</span> 7.9
                </p>

            </article>


            <!-- FILME 3 -->
            <article class="filme">

                <div class="poster poster3">

                    <!-- <span class="favorito">♡</span> -->

                    <div class="sol"></div>

                    <div class="montanhas"></div>

                    <div class="agua"></div>

                </div>


                <h2>Dias em Silêncio</h2>

                <p class="informacoes">
                    2021 | Drama
                </p>

                <p class="avaliacao">
                    <span>★</span> 8.1
                </p>

            </article>


            <!-- FILME 4 -->
            <article class="filme">

                <div class="poster poster4">

                    <!-- <span class="favorito">♡</span> -->

                    <div class="predios"></div>

                    <div class="reflexo"></div>

                </div>


                <h2>Cidade de Néon</h2>

                <p class="informacoes">
                    2020 | Ação
                </p>

                <p class="avaliacao">
                    <span>★</span> 7.6
                </p>

            </article>


            <!-- FILME 5 -->
            <article class="filme">

                <div class="poster poster5">

                    <!-- <span class="favorito">♡</span> -->

                    <div class="lua-cheia"></div>

                    <div class="arvore"></div>

                </div>


                <h2>O Que Fica</h2>

                <p class="informacoes">
                    2019 | Terror
                </p>

                <p class="avaliacao">
                    <span>★</span> 7.8
                </p>

            </article>


            <!-- FILME 6 -->
            <article class="filme">

                <div class="poster poster6">

                    <!-- <span class="favorito">♡</span> -->

                    <div class="planeta"></div>

                    <div class="montanha-final"></div>

                </div>


                <h2>Além da Terra</h2>

                <p class="informacoes">
                    2024 | Aventura
                </p>

                <p class="avaliacao">
                    <span>★</span> 8.3
                </p>

            </article>

        </section>

    </main>

</body>

</html>
