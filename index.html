<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScope</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            Cine<span>Scope</span>
        </div>

        <nav>
            <a href="catalago.html" class="ativo">Filmes</a>
            <a href="#">Favoritos</a>
            <a href="#">Listas</a>
        </nav>

    </header>


    <main>

        <section class="conteudo">

            <h1>Encontre seu próximo filme</h1>

            <p>Pesquise por nome, gênero ou ano</p>


            <div class="pesquisa">

                <span>⌕</span>

                <input
                    type="text"
                    placeholder="Buscar filmes..."
                >

            </div>


            <div class="generos">

                <button>Ação</button>
                <button>Drama</button>
                <button>Terror</button>
                <button>Comédia</button>
                <button>Ficção Científica</button>
                <button>Documentário</button>

            </div>


            <div class="sugestoes">

                <a href="#">Sugestões populares</a>
                <a href="#">Horizontes</a>
                <a href="#">Cidade de Néon</a>
                <a href="#">O Que Fica</a>

            </div>

        </section>

    </main>

</body>
</html>
